services:
  - type: web
    name: lubrication-web
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lubrication-db
          property: connectionString

databases:
  - name: lubrication-db
    plan: free
    databaseName: lubrication
    user: lubrication_user
